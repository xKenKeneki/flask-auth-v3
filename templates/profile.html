<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Flask Auth Practice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        main {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .content {
            max-width: 700px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #7dd3fc;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Flask Auth Practice</div>

        <nav>
            <a href="/">Home</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main>
        <div class="content">
            <h1>Welcome, <span>{{ session["username"] }}</span></h1>

            <p>
                You are logged in. This page is only visible to
                authenticated users.
            </p>

            <a href="/logout" class="button">
                Log out
            </a>
        </div>
    </main>

    <footer>
        Built while learning Python and Flask · 2026
    </footer>

</body>
</html>
