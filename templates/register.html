<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: #1e293b;
            width: 350px;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #334155;
            color: white;
            outline: none;
        }

        input:focus {
            outline: 2px solid #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #38bdf8;
            color: #0f172a;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #94a3b8;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <form method="POST">
            <div class="field">
                <label for="username">Username:</label>
                <input type="text" name="username">
                {% if error %}
                    <p>{{ error }}</p>
                {% endif %}
            </div>
            <div class="field">
                <label for="password">Password:</label>
                <input type="password" name="password">
            </div>
            <div class="field">
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" name="confirm_password">
            </div>
            <div class="field">
                <label for="email">Email:</label>
                <input type="email" name="email">
            </div>
            <div class="field">
                <label for="date_of_birth">Date of Birth:</label>
                <input type="date" name="date_of_birth">
            </div>
            <button type="submit">Register</button>
        </form>

        <a href="/" class="back">
            ← Back
        </a>

    </div>
</body>
</html>
